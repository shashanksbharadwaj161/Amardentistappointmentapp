- back
- back
- tapOn: "Join as a dental professional"
- tapOn: "Clinic operations"
- tapOn: "Open clinical record"
- assertVisible: "Structured clinical note"
- assertVisible: "FDI odontogram"
- assertVisible: "Review each medicine"
- assertVisible: "Clinical images and X-rays"
